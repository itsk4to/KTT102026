
name: Kato Tu Tien - ZIP Update

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Tên file ZIP trong repo itsk4to/File-Update"
        required: true
        type: string
        default: "KatoTuTien-v3.8.1-complete.zip"

permissions:
  contents: write

concurrency:
  group: ktt-zip-update
  cancel-in-progress: false

jobs:
  update:
    name: Validate, Test and Push Update
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout main
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kato-tutien/requirements.txt

      # 3. Validate ZIP filename
      - name: Validate ZIP filename
        id: zip
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail

          if [[ ! "$ZIP_NAME" =~ ^(KatoTT|KatoTuTien)-v[0-9]+\.[0-9]+\.[0-9]+[-A-Za-z0-9_.]*\.zip$ ]]; then
            echo "::error::Tên ZIP không hợp lệ: $ZIP_NAME"
            exit 1
          fi

          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "ZIP được chọn: $ZIP_NAME"

      # 4. Download ZIP
      - name: Download update ZIP
        shell: bash
        env:
          ZIP_NAME: ${{ steps.zip.outputs.name }}
        run: |
          set -euo pipefail

          URL="https://raw.githubusercontent.com/itsk4to/File-Update/main/${ZIP_NAME}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "$URL" \
            --output "$RUNNER_TEMP/ktt-update.zip"

          test -s "$RUNNER_TEMP/ktt-update.zip"

          echo "Đã tải ZIP:"
          ls -lh "$RUNNER_TEMP/ktt-update.zip"

      # 5. Validate archive
      - name: Validate ZIP archive
        run: |
          set -euo pipefail
          unzip -t "$RUNNER_TEMP/ktt-update.zip"

      # 6. Safely extract into kato-tutien/
      - name: Extract update safely
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "ktt-update.zip"
          destination = Path("kato-tutien")
          temp = Path(os.environ["RUNNER_TEMP"]) / "ktt-extract"

          if temp.exists():
              import shutil
              shutil.rmtree(temp)

          temp.mkdir(parents=True)
          destination.mkdir(parents=True, exist_ok=True)

          blocked_dirs = {
              ".git",
              ".github",
              ".venv",
              "venv",
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              "node_modules",
          }

          blocked_suffixes = {
              ".db",
              ".sqlite",
              ".sqlite3",
          }

          def is_protected(parts):
              for part in parts:
                  lower = part.lower()

                  if lower in blocked_dirs:
                      return True

                  if lower == ".env":
                      return True

                  if lower.startswith(".env.") and lower != ".env.example":
                      return True

                  if ":memory:" in lower:
                      return True

              name = parts[-1].lower() if parts else ""

              if Path(name).suffix.lower() in blocked_suffixes:
                  return True

              return False

          with zipfile.ZipFile(archive) as z:
              entries = []

              for info in z.infolist():
                  raw = info.filename.replace("\\", "/")
                  path = PurePosixPath(raw)

                  if path.is_absolute() or not path.parts:
                      raise RuntimeError(f"Đường dẫn ZIP không an toàn: {raw}")

                  if ".." in path.parts:
                      raise RuntimeError(f"Phát hiện path traversal: {raw}")

                  # ZIP này phải có thư mục gốc KatoTuTien-vX.Y.Z/
                  if len(path.parts) < 2:
                      continue

                  if not path.parts[0].startswith("KatoTuTien-v"):
                      raise RuntimeError(
                          f"Thư mục gốc không đúng định dạng: {path.parts[0]}"
                      )

                  relative = path.parts[1:]

                  if not relative:
                      continue

                  if is_protected(relative):
                      print(f"SKIP protected: {raw}")
                      continue

                  # Không cho phép symlink trong ZIP
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise RuntimeError(f"Không chấp nhận symlink: {raw}")

                  if info.is_dir():
                      continue

                  entries.append((info, relative))

              # Kiểm tra cấu trúc project
              relative_files = {
                  "/".join(parts)
                  for _, parts in entries
              }

              required = {
                  "bot.py",
                  "VERSION.txt",
                  "requirements.txt",
                  "game/database/schema.py",
                  "game/database/migrations.py",
              }

              missing = required - relative_files

              if missing:
                  raise RuntimeError(
                      "ZIP thiếu file bắt buộc: " + ", ".join(sorted(missing))
                  )

              for info, parts in entries:
                  target = temp.joinpath(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(info) as source, target.open("wb") as output:
                      output.write(source.read())

          # Kiểm tra lại project sau giải nén
          if not (temp / "bot.py").is_file():
              raise RuntimeError("Không tìm thấy bot.py sau giải nén")

          if not (temp / "game").is_dir():
              raise RuntimeError("Không tìm thấy thư mục game/")

          # Copy file mới và ghi đè file code cũ.
          # Không xóa file cũ nếu ZIP không chứa file đó.
          import shutil

          copied = 0

          for source in temp.rglob("*"):
              if not source.is_file():
                  continue

              relative = source.relative_to(temp)
              target = destination / relative

              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              copied += 1

          print(f"Đã cập nhật {copied} file vào {destination}/")
          PY

      # 7. Verify version and features
      - name: Verify Kato Tu Tien v3.8.1
        working-directory: kato-tutien
        run: |
          set -euo pipefail

          echo "Checking version..."
          VERSION="$(tr -d '[:space:]' < VERSION.txt)"

          if [[ "$VERSION" != "3.8.1" ]]; then
            echo "::error::Sai phiên bản: $VERSION"
            exit 1
          fi

          echo "Checking schema version..."
          grep -Eq 'SCHEMA_VERSION[[:space:]]*=[[:space:]]*18' \
            game/database/schema.py

          echo "Checking migrations..."
          grep -q 'def migrate_16_to_17' game/database/migrations.py
          grep -q 'def migrate_17_to_18' game/database/migrations.py

          echo "Checking moderation..."
          test -f game/moderation/repository.py
          test -f game/moderation/service.py
          test -f ui/commands/moderation.py

          echo "Checking prison..."
          test -f game/moderation/prison_repository.py
          test -f game/moderation/prison_service.py
          test -f ui/commands/prison.py
          test -f tests/unit/test_prison_service.py

          echo "Checking bot registration..."
          grep -q 'register_moderation_commands' bot.py
          grep -q 'recover_prison_workflows' bot.py

          echo "All v3.8.1 checks passed."

      # 8. Install dependencies
      - name: Install dependencies
        working-directory: kato-tutien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 9. Compile Python
      - name: Compile Python files
        working-directory: kato-tutien
        run: |
          python -m compileall -q .

      # 10. Run tests
      - name: Run test suite
        working-directory: kato-tutien
        run: |
          python -m pytest -q

      # 11. Check protected files were not staged
      - name: Stage source update
        run: |
          set -euo pipefail

          git add -A -- kato-tutien

          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "diff", "--cached", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          )

          files = [
              line.strip()
              for line in result.stdout.splitlines()
              if line.strip()
          ]

          forbidden_suffixes = (".db", ".sqlite", ".sqlite3")

          for filename in files:
              lower = filename.lower()
              basename = lower.rsplit("/", 1)[-1]

              if not filename.startswith("kato-tutien/"):
                  sys.exit(f"File ngoài project bị stage: {filename}")

              if basename == ".env":
                  sys.exit(f"Từ chối commit file .env: {filename}")

              if basename.endswith(forbidden_suffixes):
                  sys.exit(f"Từ chối commit database: {filename}")

              if ":memory:" in basename:
                  sys.exit(f"Từ chối commit file dữ liệu đặc biệt: {filename}")

          print(f"Đã kiểm tra {len(files)} file staged.")
          PY

      # 12. Commit and push directly to main
      - name: Commit and push to main
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "Không có thay đổi mới. Bỏ qua commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Kato Tu Tien v3.8.1"

          # Đồng bộ main trước khi push để tránh ghi đè commit mới.
          git fetch origin main
          git rebase origin/main

          # Push trực tiếp, không tạo Pull Request.
          git push origin HEAD:main

          echo "Đã push Kato Tu Tien v3.8.1 lên main."
