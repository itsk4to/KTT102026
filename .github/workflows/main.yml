
name: Kato Tu Tien - ZIP Update

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Ten file ZIP trong itsk4to/File-Update"
        required: true
        default: "KatoTT-v3.8.0-manual-moderation-update.zip"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ktt-zip-update
  cancel-in-progress: false

jobs:
  update-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate ZIP filename
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          if [[ ! "$ZIP_NAME" =~ ^KatoTT-v[0-9]+\.[0-9]+\.[0-9]+[-A-Za-z0-9_.]*\.zip$ ]]; then
            echo "Ten ZIP khong hop le: $ZIP_NAME"
            exit 1
          fi

      - name: Download update ZIP
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/itsk4to/File-Update/main/$ZIP_NAME" \
            --output /tmp/ktt-update.zip
          unzip -t /tmp/ktt-update.zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Extract at repository root so apply_update.py
      # can update kato-tutien/ correctly.
      - name: Extract update package safely
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          archive = Path("/tmp/ktt-update.zip")
          root = Path.cwd().resolve()
          protected_parts = {".git", ".github", ".env", ".venv", "__pycache__"}
          protected_suffixes = (".db", ".sqlite", ".sqlite3")
          allowed_root_files = {"README-INSTALL.md", "apply_update.py"}
          max_total = 100 * 1024 * 1024
          written = 0

          with ZipFile(archive) as zf:
              files = [item for item in zf.infolist() if not item.is_dir()]
              if not files:
                  raise SystemExit("ZIP khong co file.")
              if sum(item.file_size for item in files) > max_total:
                  raise SystemExit("ZIP vuot qua 100 MB giai nen.")

              for item in files:
                  raw = item.filename.replace("\\", "/")
                  parts = list(PurePosixPath(raw).parts)

                  if not parts or raw.startswith("/") or ".." in parts:
                      raise SystemExit(f"Duong dan khong an toan: {raw}")

                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit(f"Khong chap nhan symlink: {raw}")

                  is_root_helper = (
                      len(parts) == 1
                      and parts[0] in allowed_root_files
                  )
                  is_project_file = (
                      parts[0] == "kato-tutien"
                      and len(parts) > 1
                  )

                  if not (is_root_helper or is_project_file):
                      raise SystemExit(
                          f"File nam ngoai pham vi ZIP cho phep: {raw}"
                      )

                  if any(part in protected_parts for part in parts):
                      print(f"Bo qua tep/thu muc bao ve: {raw}")
                      continue

                  if (
                      parts[-1].lower() == ".env"
                      or parts[-1].lower().endswith(protected_suffixes)
                  ):
                      print(f"Bo qua du lieu nhay cam: {raw}")
                      continue

                  target = root.joinpath(*parts).resolve()

                  if target != root and root not in target.parents:
                      raise SystemExit(
                          f"Duong dan vuot khoi repository: {raw}"
                      )

                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(item))
                  written += 1
                  print(f"Extracted: {target.relative_to(root)}")

          if written == 0:
              raise SystemExit("Khong co file nao duoc giai nen.")

          print(f"Da giai nen {written} file vao dung vi tri.")
          PY

      - name: Apply the package migration and integration
        run: python apply_update.py

      - name: Verify moderation migration wiring
        working-directory: kato-tutien
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path("game/database/schema.py").read_text(encoding="utf-8")
          migrations = Path("game/database/migrations.py").read_text(encoding="utf-8")
          engine = Path("game/engine.py").read_text(encoding="utf-8")
          bot = Path("bot.py").read_text(encoding="utf-8")

          checks = {
              "schema version 17":
                  "SCHEMA_VERSION = 17" in schema,
              "moderation_cases table":
                  "CREATE TABLE IF NOT EXISTS moderation_cases" in schema,
              "16-to-17 migration function":
                  "def migrate_16_to_17(db)" in migrations,
              "16-to-17 migration registry":
                  "16: migrate_16_to_17," in migrations,
              "moderation service in engine":
                  "self.moderation = ModerationService(db)" in engine,
              "moderation commands registered":
                  "register_moderation_commands(tree, engine.moderation)" in bot,
          }

          for label, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + label)

          if not all(checks.values()):
              raise SystemExit("Thieu thanh phan tich hop moderation.")
          PY

      - name: Install dependencies and run tests
        working-directory: kato-tutien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          python -m compileall -q .
          python -m pytest -q

      - name: Create update branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ inputs.zip_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if git diff --quiet -- kato-tutien; then
            echo "ZIP khong tao ra thay doi nao; dung de tranh PR rong."
            exit 1
          fi

          SAFE_NAME="${ZIP_NAME%.zip}"
          BRANCH="automation/${SAFE_NAME}-${RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add kato-tutien
          git commit -m "Apply ${SAFE_NAME}"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Kato Tu Tien update: ${SAFE_NAME}" \
            --body "ZIP: ${ZIP_NAME}

          Package apply_update.py was executed from the repository root.
          Compileall and pytest must pass before this PR is created.
          Review the diff before merging. Database files and real .env are excluded."
