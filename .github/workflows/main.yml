
name: Kato Tu Tien - ZIP Update

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Tên ZIP trong repo itsk4to/File-Update"
        required: true
        type: string
        default: "KTT102026_V3.9.9.zip"

permissions:
  contents: write

concurrency:
  group: ktt-zip-update
  cancel-in-progress: false

jobs:
  update:
    name: Validate and Push Update
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Validate ZIP filename
      - name: Validate ZIP filename
        id: zip
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail

          VERSION=""

          if [[ "$ZIP_NAME" =~ ^KTT102026_V([0-9]+\.[0-9]+\.[0-9]+)(_[A-Za-z0-9.-]+)?\.zip$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$ZIP_NAME" =~ ^(KatoTT|KatoTuTien)-v([0-9]+\.[0-9]+\.[0-9]+)[-A-Za-z0-9_.]*\.zip$ ]]; then
            VERSION="${BASH_REMATCH[2]}"
          else
            echo "::error::Tên ZIP không hợp lệ: $ZIP_NAME"
            exit 1
          fi

          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "ZIP: $ZIP_NAME"
          echo "Version: $VERSION"

      # 3. Download ZIP
      - name: Download update ZIP
        shell: bash
        env:
          ZIP_NAME: ${{ steps.zip.outputs.name }}
        run: |
          set -euo pipefail

          URL="https://raw.githubusercontent.com/itsk4to/File-Update/main/${ZIP_NAME}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "$URL" \
            --output "$RUNNER_TEMP/ktt-update.zip"

          test -s "$RUNNER_TEMP/ktt-update.zip"

          echo "Downloaded:"
          ls -lh "$RUNNER_TEMP/ktt-update.zip"

      # 4. Validate ZIP
      - name: Validate ZIP archive
        run: |
          set -euo pipefail
          unzip -t "$RUNNER_TEMP/ktt-update.zip"

      # 5. Extract safely and resolve duplicate paths
      - name: Extract update safely
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import stat
          import shutil
          import zipfile

          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "ktt-update.zip"
          destination = Path("kato-tutien")
          temp = Path(os.environ["RUNNER_TEMP"]) / "ktt-extract"

          if temp.exists():
              shutil.rmtree(temp)

          temp.mkdir(parents=True)
          destination.mkdir(parents=True, exist_ok=True)

          blocked_dirs = {
              ".git",
              ".github",
              ".venv",
              "venv",
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              "node_modules",
          }

          blocked_suffixes = {
              ".db",
              ".sqlite",
              ".sqlite3",
          }

          def is_protected(parts):
              for part in parts:
                  lower = part.lower()

                  if lower in blocked_dirs:
                      return True

                  if lower == ".env":
                      return True

                  if lower.startswith(".env.") and lower != ".env.example":
                      return True

              filename = parts[-1].lower() if parts else ""

              if Path(filename).suffix.lower() in blocked_suffixes:
                  return True

              return False

          with zipfile.ZipFile(archive) as z:
              files = []

              for info in z.infolist():
                  raw = info.filename.replace("\\", "/")
                  path = PurePosixPath(raw)

                  if path.is_absolute() or not path.parts:
                      raise RuntimeError(f"Path không an toàn: {raw}")

                  if ".." in path.parts or ":" in path.parts[0]:
                      raise RuntimeError(f"Path traversal: {raw}")

                  mode = info.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      raise RuntimeError(f"Không chấp nhận symlink: {raw}")

                  if info.is_dir():
                      continue

                  files.append((info, path.parts))

              if not files:
                  raise RuntimeError("ZIP không chứa file nào.")

              total_size = sum(info.file_size for info, _ in files)

              if total_size > 200 * 1024 * 1024:
                  raise RuntimeError("ZIP vượt giới hạn giải nén 200 MB.")

              # Xác định thư mục bọc ngoài cùng.
              first_parts = {parts[0] for _, parts in files}
              strip_root = None

              if len(first_parts) == 1:
                  candidate = next(iter(first_parts))

                  if re.match(
                      r"^(KatoTuTien|KatoTT|KTT102026)([-_].*)?$",
                      candidate,
                      re.IGNORECASE,
                  ):
                      strip_root = candidate

              # Chọn file theo đường dẫn đã chuẩn hóa.
              # Ưu tiên file bên trong kato-tutien/.
              selected = {}

              for info, parts in files:
                  relative = parts

                  # Bỏ thư mục bọc ngoài.
                  if strip_root and relative[0].lower() == strip_root.lower():
                      relative = relative[1:]

                  # File thuộc project được ưu tiên.
                  if relative and relative[0].lower() == "kato-tutien":
                      priority = 2
                      relative = relative[1:]
                  else:
                      priority = 1

                  if not relative:
                      continue

                  if is_protected(relative):
                      print(f"SKIP protected: {info.filename}")
                      continue

                  normalized = PurePosixPath(*relative).as_posix()
                  previous = selected.get(normalized)

                  if previous is not None:
                      old_priority, old_info = previous

                      if priority == old_priority:
                          raise RuntimeError(
                              f"ZIP trùng file cùng mức ưu tiên: {normalized}"
                          )

                      if priority < old_priority:
                          print(f"SKIP duplicate: {info.filename}")
                          continue

                      print(f"Ưu tiên file project: {info.filename}")

                  selected[normalized] = (priority, info)

              if not selected:
                  raise RuntimeError("Không có file hợp lệ để cập nhật.")

              # Giải nén các file đã chọn.
              extracted = set()

              for normalized, (_, info) in selected.items():
                  relative_path = Path(*PurePosixPath(normalized).parts)
                  target = temp / relative_path

                  target.parent.mkdir(parents=True, exist_ok=True)

                  with z.open(info) as source:
                      with target.open("wb") as output:
                          shutil.copyfileobj(source, output)

                  extracted.add(normalized)

              print(f"Đã chọn {len(extracted)} file.")

          # Overlay: thêm và ghi đè, không xóa file cũ.
          copied = 0

          for source in temp.rglob("*"):
              if not source.is_file():
                  continue

              relative = source.relative_to(temp)
              target = destination / relative

              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

              copied += 1

          print(f"Đã cập nhật {copied} file vào {destination}/")
          PY

      # 6. Verify project version
      - name: Verify project version
        working-directory: kato-tutien
        env:
          EXPECTED_VERSION: ${{ steps.zip.outputs.version }}
        run: |
          set -euo pipefail

          echo "Checking project..."

          test -f bot.py
          test -f VERSION.txt
          test -f requirements.txt
          test -d game
          test -f game/database/schema.py
          test -f game/database/migrations.py

          VERSION="$(tr -d '[:space:]' < VERSION.txt)"

          echo "Expected: $EXPECTED_VERSION"
          echo "Actual: $VERSION"

          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Sai phiên bản!"
            exit 1
          fi

          echo "Version $VERSION verified."

      # 7. Stage and protect files
      - name: Stage source update
        shell: bash
        run: |
          set -euo pipefail

          git add -A -- kato-tutien

          python - <<'PY'
          import subprocess
          import sys
          from pathlib import PurePosixPath

          result = subprocess.run(
              ["git", "diff", "--cached", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          )

          files = [
              line.strip()
              for line in result.stdout.splitlines()
              if line.strip()
          ]

          forbidden_suffixes = (".db", ".sqlite", ".sqlite3")

          for filename in files:
              path = PurePosixPath(filename)
              basename = path.name.lower()

              if not filename.startswith("kato-tutien/"):
                  sys.exit(f"File ngoài project: {filename}")

              if basename == ".env":
                  sys.exit(f"Từ chối commit .env: {filename}")

              if basename.startswith(".env.") and basename != ".env.example":
                  sys.exit(f"Từ chối commit file môi trường: {filename}")

              if basename.endswith(forbidden_suffixes):
                  sys.exit(f"Từ chối commit database: {filename}")

          print(f"Đã kiểm tra {len(files)} file staged.")
          PY

      # 8. Commit and push
      - name: Commit and push to main
        shell: bash
        env:
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "Không có thay đổi mới."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Kato Tu Tien v${VERSION}"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

          echo "Đã push Kato Tu Tien v${VERSION} lên main."
